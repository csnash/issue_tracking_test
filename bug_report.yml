name: Bug Report
description: Something isn't working correctly
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part of the system?
      options:
        - Survey123 form
        - Report generation
        - Photo handling
        - Server/webhook
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What were you doing when it broke?

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
